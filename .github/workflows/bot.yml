name: Bot Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore session
        run: echo '${{ secrets.SESSION_JSON }}' > session.json

      - name: Run booking bot
        run: node visa-booking-script.js
        env:
          TWO_CAPTCHA_KEY: ${{ secrets.TWO_CAPTCHA_KEY }}
        timeout-minutes: 5