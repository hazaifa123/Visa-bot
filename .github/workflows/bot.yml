name: Bot Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore session
        # Use printf so newlines and special characters in the secret are preserved
        run: |
          printf '%s' "${{ secrets.SESSION_JSON }}" > session.json

      - name: Run booking bot
        run: node visa-booking-script.js
        env:
          TWO_CAPTCHA_KEY: ${{ secrets.TWO_CAPTCHA_KEY }}
        timeout-minutes: 15

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            error-screenshot.png
            error-page.html
            *.log
